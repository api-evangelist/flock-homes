name: Flock Homes
description: >-
  Flock Homes is a real estate investment platform, founded in 2020 and backed
  by a16z, that lets individual rental-property owners retire from active
  landlording by contributing their single-family and multifamily homes into a
  professionally managed, diversified residential real estate fund. Flock uses a
  721 Exchange (an UPREIT contribution) so owners can trade appreciated rental
  property for fund shares on a tax-deferred basis, deferring capital gains and
  depreciation-recapture taxes while eliminating repair, vacancy, and eviction
  responsibilities. Fund investors receive quarterly cash-flow distributions and
  long-term appreciation across a nationwide portfolio, with Flock handling all
  property management, maintenance, and tenant operations. No public developer
  API, SDK, or documentation surface has been found; this profile is maintained
  as a company record in the API Evangelist network.
